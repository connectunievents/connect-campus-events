# Netlify build settings. The Next.js app lives in ./app.
[build]
  base = "app"
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

# Netlify's Next.js runtime turns pages, API routes and the auth proxy into
# server functions. Without it .next is uploaded as static files and every route 404s.
[[plugins]]
  package = "@netlify/plugin-nextjs"
