<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Reset password — Connect</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600;1,700&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../codes/access-control.js" defer></script>
<script src="../codes/chat-widget.js" defer></script>
<script src="../codes/micro-interactions.js" defer></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --forest:    #081C10;
  --forest-mid:#0E3320;
  --forest-lt: #16542F;
  --leaf:      #3DBA6F;
  --leaf-bright:#52D483;
  --pale:      #C4EDD4;
  --pale2:     #DFF2E8;
  --white:     #FFFFFF;
  --off-white: #F3FAF6;
  --ink:       #060E09;
  --ink-mid:   #1A2D20;
  --muted:     #456050;
  --border:    #B8D9C5;
  --font-display: 'Playfair Display', Georgia, serif;
  --font-body:    'Plus Jakarta Sans', sans-serif;
}
html{scroll-behavior:smooth;}
body{background:var(--off-white);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.6;overflow-x:hidden;}
a{text-decoration:none;color:inherit;}
button{font-family:var(--font-body);}

nav{
  position:fixed;top:0;left:0;right:0;z-index:100;
  display:flex;align-items:center;justify-content:space-between;
  padding:22px 56px;
  background:rgba(255,255,255,0.96);
  backdrop-filter:blur(12px);
  box-shadow:0 1px 0 var(--border);
}
.logo{
  font-family:var(--font-display);
  font-weight:700;font-size:26px;
  color:var(--ink);
  letter-spacing:-0.3px;
  display:flex;align-items:center;gap:8px;
}
.logo-mark{width:10px;height:10px;border-radius:50%;background:var(--leaf);}

.center-wrap{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  padding:140px 24px 60px;
}
.reset-card{
  width:100%;max-width:400px;
  background:var(--white);
  border:1px solid var(--border);
  border-radius:18px;
  padding:44px 38px;
}
.reset-eyebrow{
  font-size:11px;font-weight:500;color:var(--leaf);
  letter-spacing:1.5px;text-transform:uppercase;margin-bottom:10px;
}
.reset-title{
  font-family:var(--font-display);font-size:28px;font-weight:700;
  color:var(--ink);letter-spacing:-.5px;margin-bottom:10px;
}
.reset-note{font-size:14px;color:var(--muted);font-weight:300;margin-bottom:28px;line-height:1.7;}
.reset-note a{color:var(--forest-mid);font-weight:500;}

.field-group{margin-bottom:20px;}
.field-label{display:block;font-size:12px;font-weight:500;color:var(--ink-mid);margin-bottom:8px;}
.field-input{
  width:100%;background:var(--off-white);border:1px solid var(--border);
  border-radius:10px;padding:13px 16px;font-size:14px;color:var(--ink);
  transition:border-color .2s, box-shadow .2s, background .2s;
}
.field-input:focus{
  outline:none;border-color:var(--forest-lt);background:var(--white);
  box-shadow:0 0 0 3px rgba(22,84,47,0.10);
}

.btn-primary{
  width:100%;background:var(--forest);color:var(--white);
  border:none;padding:15px;border-radius:10px;
  font-size:15px;font-weight:500;cursor:pointer;
  transition:all .25s;
}
.btn-primary:hover{background:var(--forest-mid);transform:translateY(-2px);}
.btn-primary:disabled{opacity:.6;cursor:not-allowed;transform:none;}

.auth-error{
  display:none;background:#FDECEC;border:1px solid #F5B5B5;color:#B42318;
  padding:12px 16px;border-radius:10px;font-size:13px;margin-bottom:18px;
}
.auth-success{
  display:none;background:var(--pale2);border:1px solid var(--forest-lt);color:var(--forest-mid);
  padding:14px 16px;border-radius:10px;font-size:13.5px;line-height:1.6;margin-bottom:18px;
}
</style>
</head>
<body>

<nav id="navbar">
  <a href="index.html" class="logo" aria-label="Connect home">
    <div class="logo-mark"></div>
    Connect
  </a>
</nav>

<div class="center-wrap">
  <div class="reset-card">
    <div class="reset-eyebrow">Reset password</div>
    <h2 class="reset-title">Forgot your password?</h2>
    <p class="reset-note">Enter the email on your account and we'll send you a link to reset it. Remembered it after all? <a href="login.html">Back to log in</a></p>

    <div class="auth-error" id="authError"></div>
    <div class="auth-success" id="authSuccess"></div>

    <form id="forgotForm">
      <div class="field-group">
        <label class="field-label" for="email">Email address</label>
        <input class="field-input" type="email" id="email" placeholder="you@example.com" required/>
      </div>
      <button type="submit" class="btn-primary" id="submitBtn">Send reset link</button>
    </form>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://zzkmvoxguxwwiarmyusq.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_fJTo7h740aOw-l-fCsGN-Q_bhgj_l0a';
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const forgotForm = document.getElementById('forgotForm');
const submitBtn = document.getElementById('submitBtn');
const authError = document.getElementById('authError');
const authSuccess = document.getElementById('authSuccess');

function showError(message){
  authError.textContent = message;
  authError.style.display = 'block';
  authSuccess.style.display = 'none';
}
function showSuccess(message){
  authSuccess.textContent = message;
  authSuccess.style.display = 'block';
  authError.style.display = 'none';
}

forgotForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  authError.style.display = 'none';
  authSuccess.style.display = 'none';

  const email = document.getElementById('email').value.trim();

  submitBtn.disabled = true;
  submitBtn.textContent = 'Sending...';

  const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
    redirectTo: window.location.origin + '/reset-password.html'
  });

  submitBtn.disabled = false;
  submitBtn.textContent = 'Send reset link';

  if (error) {
    showError(error.message);
    return;
  }

  forgotForm.reset();
  showSuccess(`If an account exists for ${email}, a reset link has been sent — check your inbox (and spam folder).`);
});
</script>
</body>
</html>
