<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Explore events — Connect</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600;1,700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>

<style>
*{box-sizing:border-box;margin:0;padding:0} :root{--forest:#081C10;--forest-mid:#0E3320;--forest-lt:#16542F;--leaf:#3DBA6F;--pale:#C4EDD4;--pale2:#DFF2E8;--white:#fff;--off:#F5FAF7;--ink:#060E09;--muted:#607466;--border:#D8E7DE;--display:'Playfair Display',Georgia,serif;--body:'Plus Jakarta Sans',sans-serif} body{background:var(--off);color:var(--ink);font-family:var(--body);font-size:14px} a{text-decoration:none;color:inherit} button,input,select{font:inherit} button{cursor:pointer}
nav{height:76px;background:rgba(255,255,255,.94);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 56px;position:sticky;top:0;z-index:20;backdrop-filter:blur(14px)} .logo{font:700 26px var(--display);display:flex;gap:8px;align-items:center}.logo-mark{width:10px;height:10px;border-radius:50%;background:var(--leaf)}.nav-links{display:flex;gap:32px;align-items:center}.nav-links a{color:var(--muted);font-size:13px}.nav-links a.active,.nav-links a:hover{color:var(--forest-mid);font-weight:600}.nav-cta{display:flex;gap:10px}.btn{border-radius:9px;padding:9px 16px;border:1px solid var(--border);background:#fff;color:var(--forest-mid);font-size:12px;font-weight:600}.btn-primary{border-color:var(--forest);background:var(--forest);color:#fff}.btn-primary:hover{background:var(--forest-mid)}
.hero{background:var(--forest);color:#fff;overflow:hidden;position:relative}.hero:before{content:'';position:absolute;width:540px;height:540px;right:-120px;top:-360px;border:1px solid rgba(82,212,131,.22);border-radius:50%;box-shadow:0 0 0 70px rgba(82,212,131,.035),0 0 0 140px rgba(82,212,131,.025)}.hero-inner{max-width:1200px;margin:auto;padding:52px 56px 42px;position:relative}.eyebrow{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--leaf);font-weight:700;margin-bottom:12px}.hero h1{font:700 clamp(34px,5vw,58px)/1.05 var(--display);letter-spacing:-1.8px;max-width:680px}.hero h1 em{color:var(--leaf);font-style:italic}.hero p{font-size:15px;font-weight:300;color:rgba(255,255,255,.72);margin:14px 0 27px;max-width:535px;line-height:1.75}.search-shell{max-width:1100px;background:#fff;padding:9px;border-radius:14px;display:grid;grid-template-columns:minmax(0,1fr) 180px 155px;gap:8px;box-shadow:0 18px 40px rgba(0,0,0,.19)}.search-field,.select-field{display:flex;align-items:center;gap:10px;padding:0 13px;border:1px solid var(--border);border-radius:9px;color:var(--muted)}.search-field input{border:0;outline:0;width:100%;padding:13px 0;color:var(--ink);background:transparent}.select-field select{width:100%;border:0;outline:0;color:var(--ink);background:transparent;padding:13px 0}.search-btn{border:0;border-radius:9px;background:var(--leaf);color:var(--forest);font-weight:700;padding:0 20px}.search-btn:hover{background:#52D483}
.quickbar{background:#fff;border-bottom:1px solid var(--border)}.quick-inner{max-width:1200px;padding:16px 56px;margin:auto;display:flex;gap:9px;overflow:auto}.chip{white-space:nowrap;border:1px solid var(--border);background:#fff;padding:7px 13px;border-radius:999px;color:var(--muted);font-size:12px;font-weight:600}.chip.active,.chip:hover{border-color:var(--forest-lt);background:var(--pale2);color:var(--forest-mid)}
.page{max-width:1200px;margin:auto;padding:34px 56px 92px;display:grid;grid-template-columns:228px minmax(0,1fr);gap:38px}.filters{align-self:start;position:sticky;top:98px}.filter-title{font-size:12px;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted);font-weight:700;margin:0 0 14px}.filter-group{border-top:1px solid var(--border);padding:18px 0}.filter-group:last-child{border-bottom:1px solid var(--border)}.filter-group h3{font-size:13px;margin-bottom:11px}.check{display:flex;gap:9px;align-items:center;color:var(--muted);font-size:13px;margin:10px 0;cursor:pointer}.check input{accent-color:var(--forest-lt);width:15px;height:15px}.clear{background:none;border:0;color:var(--forest-lt);font-weight:700;font-size:12px;margin-top:6px}.results-head{display:flex;justify-content:space-between;align-items:end;margin-bottom:20px;gap:16px}.results-head h2{font:700 30px var(--display);letter-spacing:-.7px}.results-head p{font-size:12px;color:var(--muted);margin-top:3px}.sort{border:1px solid var(--border);border-radius:8px;background:#fff;padding:9px 10px;color:var(--muted);font-size:12px;outline:none}.events{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:19px}.event-card{background:#fff;border:1px solid var(--border);border-radius:13px;overflow:hidden;transition:transform .22s,box-shadow .22s;cursor:pointer}.event-card:hover{transform:translateY(-5px);box-shadow:0 16px 28px rgba(8,28,16,.12)}.event-art{height:148px;padding:14px;display:flex;justify-content:space-between;align-items:flex-start;position:relative;overflow:hidden}.event-art:after{content:'';position:absolute;width:130px;height:130px;border-radius:50%;border:1px solid rgba(255,255,255,.35);bottom:-75px;right:-30px;box-shadow:0 0 0 26px rgba(255,255,255,.08)}.art-talk{background:linear-gradient(135deg,#143B7A,#43A2E7)}.art-music{background:linear-gradient(135deg,#4B1D6B,#D15AA5)}.art-workshop{background:linear-gradient(135deg,#0C5B45,#4CBF86)}.art-sport{background:linear-gradient(135deg,#B04016,#F0A42C)}.art-community{background:linear-gradient(135deg,#294B28,#92C75B)}.art-tech{background:linear-gradient(135deg,#142033,#5B82AD)}.event-badge{font-size:10px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;padding:5px 8px;background:rgba(255,255,255,.92);border-radius:5px;color:var(--forest-mid);position:relative;z-index:1}.art-symbol{font-size:45px;line-height:1;filter:drop-shadow(0 4px 6px rgba(0,0,0,.17));position:relative;z-index:1}.event-body{padding:15px 15px 17px}.event-date{color:var(--forest-lt);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:7px}.event-card h3{font-size:15px;line-height:1.38;letter-spacing:-.25px;min-height:42px}.event-meta{border-top:1px solid #edf3ef;margin-top:13px;padding-top:11px;color:var(--muted);font-size:11px;line-height:1.8}.event-university{font-size:10px;color:#698979;font-weight:700;margin-top:6px}.empty{grid-column:1/-1;background:#fff;border:1px dashed var(--border);border-radius:12px;padding:45px;text-align:center;color:var(--muted)}.empty h3{font:700 22px var(--display);color:var(--ink);margin-bottom:8px}
@media(max-width:980px){nav{padding:0 24px}.hero-inner,.quick-inner,.page{padding-left:24px;padding-right:24px}.events{grid-template-columns:repeat(2,minmax(0,1fr))}.page{grid-template-columns:1fr}.filters{position:static;display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.filter-title{grid-column:1/-1;margin-bottom:-6px}.filter-group{border-bottom:1px solid var(--border)}}@media(max-width:700px){nav{height:auto;min-height:70px;padding:14px 20px;flex-wrap:wrap;gap:12px}.nav-links{order:3;width:100%;overflow:auto;gap:20px;padding-bottom:3px}.nav-cta .btn{padding:8px 11px}.hero-inner{padding-top:43px}.search-shell{grid-template-columns:1fr}.search-btn{padding:13px}.quick-inner{padding-top:12px;padding-bottom:12px}.page{padding-top:26px;gap:25px}.filters{display:block}.filter-title{margin-bottom:14px}.filter-group{padding:13px 0}.filter-group:not(:first-of-type){display:none}.events{grid-template-columns:1fr}.results-head{align-items:start;flex-direction:column}.event-art{height:165px}}
.event-modal{display:none;position:fixed;inset:0;z-index:100;background:rgba(6,14,9,.68);padding:24px;align-items:center;justify-content:center}.event-modal.open{display:flex}.event-modal-card{width:min(560px,100%);background:#fff;border-radius:18px;padding:32px;position:relative}.event-modal-close{position:absolute;right:16px;top:16px;border:0;background:var(--off);border-radius:50%;width:34px;height:34px}.event-modal-card h2{font:700 28px var(--display);padding-right:34px}.event-modal-details{color:var(--forest-lt);font-size:12px;font-weight:700;margin:12px 0}.event-modal-description{color:var(--muted);line-height:1.7}.register-row{margin-top:22px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}.register-status{font-size:12px;color:var(--muted)}#ticketQr{width:180px;display:block;margin-top:18px;border:1px solid var(--border);border-radius:10px}
</style>
</head>
<body>
<nav>
  <a href="index.html" class="logo"><span class="logo-mark"></span>Connect</a>
  <div class="nav-links">
    <a href="index.html">Home</a><a class="active" href="explore-events.html">Explore events</a><a href="sponsors.html" data-student-only hidden>Sponsors</a><a href="become-a-sponsor.html">Become a sponsor</a><a href="about.html">About</a>
  </div>
  <div class="nav-cta"><button class="btn" onclick="location.href='login.html'">Log in</button><button class="btn btn-primary" onclick="location.href='signup.html'">Sign up free</button></div>
</nav>
<header class="hero"><div class="hero-inner"><div class="eyebrow">Campus events, all in one place</div><h1>Find your next <em>great night out.</em></h1><p>Discover talks, workshops, performances, and student life across Lebanon’s universities.</p><div class="search-shell"><label class="search-field" aria-label="Search events"><span>⌕</span><input id="searchInput" type="search" placeholder="Search by event, club, or topic"/></label><label class="select-field"><span>⌖</span><select id="universitySelect"><option value="all">All universities</option><option value="LAU">Lebanese American University</option><option value="AUB">American University of Beirut</option><option value="NDU">Notre Dame University</option></select></label><button class="search-btn" id="searchButton">Search events</button></div></div></header>
<div class="quickbar"><div class="quick-inner" id="quickFilters"><button class="chip active" data-quick="all">For you</button><button class="chip" data-quick="today">Today</button><button class="chip" data-quick="weekend">This weekend</button><button class="chip" data-quick="Free">Free events</button><button class="chip" data-quick="Music">Music</button><button class="chip" data-quick="Workshop">Workshops</button></div></div>
<main class="page"><aside class="filters"><div class="filter-title">Filter events</div><section class="filter-group"><h3>Category</h3><label class="check"><input type="checkbox" value="Talk" class="category">Talks &amp; panels</label><label class="check"><input type="checkbox" value="Workshop" class="category">Workshops</label><label class="check"><input type="checkbox" value="Music" class="category">Music &amp; arts</label><label class="check"><input type="checkbox" value="Sports" class="category">Sports</label><label class="check"><input type="checkbox" value="Community" class="category">Community</label></section><section class="filter-group"><h3>Price</h3><label class="check"><input type="checkbox" value="Free" class="price">Free</label><label class="check"><input type="checkbox" value="Paid" class="price">Paid</label></section><button class="clear" id="clearFilters">Clear all filters</button></aside><section><div class="results-head"><div><h2>Explore events</h2><p id="resultCount" aria-live="polite"></p></div><select class="sort" id="sortSelect" aria-label="Sort events"><option value="soon">Soonest first</option><option value="name">Name A–Z</option></select></div><div class="events" id="eventGrid"></div></section></main>
<div class="event-modal" id="eventModal" role="dialog" aria-modal="true" aria-labelledby="eventModalTitle"><div class="event-modal-card"><button class="event-modal-close" id="eventModalClose" aria-label="Close">×</button><h2 id="eventModalTitle"></h2><div class="event-modal-details" id="eventModalDetails"></div><p class="event-modal-description" id="eventModalDescription"></p><div class="register-row"><button class="btn btn-primary" id="registerButton">Register</button><span class="register-status" id="registerStatus" aria-live="polite"></span></div><img id="ticketQr" hidden alt="Your event QR ticket"/></div></div>
<script src="../codes/explore-events.js" defer></script>
</body></html>
